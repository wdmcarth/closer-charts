name: Refresh dashboard

# Refreshes data/dashboard.json (14-day reliever appearance grid per team).
# This one is the heaviest — fetches ~200 game boxscores + winProbability
# feeds. Expect 60–90s wall time on cold cache.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window size in days"
        type: number
        default: 14
        required: false

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard_data.py
        run: python3 dashboard_data.py --days ${{ inputs.days || 14 }}

      - name: Commit dashboard.json (if changed)
        run: |
          git config user.name "closer-charts-bot"
          git config user.email "closer-charts-bot@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh RP Dashboard ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push race on attempt $i; retrying..."
              sleep 2
            done
          fi
