name: Refresh stats

# Triggered manually by the Cloudflare Worker via workflow_dispatch, OR
# manually from the Actions tab. Pulls season pitching stats + per-chip
# game logs from MLB statsapi, regenerates data/stats.json, commits.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only one refresh-stats run at a time. A second click while one is
  # already in flight gets queued so the second commit lands cleanly.
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh_stats.py
        run: python3 refresh_stats.py

      - name: Commit stats.json (if changed)
        run: |
          git config user.name "closer-charts-bot"
          git config user.email "closer-charts-bot@users.noreply.github.com"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh stats ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
