name: Refresh rosters

# Refreshes data/rosters.json (40-man rosters per team) and
# data/pitcher_index.json (all-org pitcher level index). Much heavier than
# refresh-stats — fetches ~266 affiliate rosters in parallel — so the
# timeout is bumped accordingly.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rosters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh_stats.py --rosters
        run: python3 refresh_stats.py --rosters

      - name: Commit rosters + pitcher_index (if changed)
        run: |
          git config user.name "closer-charts-bot"
          git config user.email "closer-charts-bot@users.noreply.github.com"
          git add data/rosters.json data/pitcher_index.json data/stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh rosters + pitcher index ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
