<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closer Charts — Reliever Recon</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <link rel="stylesheet" href="styles.css?v=25">
  <script>window.CC_VIEW_MODE = true;</script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Closer Charts</h1>
      <span class="subtle" id="lastUpdated"></span>
    </div>
    <div class="topbar-actions"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="chart">Chart</button>
    <button class="tab" data-view="quickhits">Quick Hits</button>
    <button class="tab" data-view="changelog">Changes</button>
    <span class="legend">
      <span class="legend-group">
        <strong>LEVCON:</strong>
        <span class="legend-item"><span class="lev-pill lev-5">5</span>clear-cut</span>
        <span class="legend-item"><span class="lev-pill lev-4">4</span>preferred/HLR</span>
        <span class="legend-item"><span class="lev-pill lev-3">3</span>shared</span>
        <span class="legend-item"><span class="lev-pill lev-2">2</span>on alert</span>
        <span class="legend-item"><span class="lev-pill lev-1">1</span>committee</span>
      </span>
      <span class="legend-group">
        <strong>Chip color:</strong>
        <span class="legend-item"><span class="color-swatch color-Blue"></span>fluid bullpen</span>
        <span class="legend-item"><span class="color-swatch color-Orange"></span>role at risk</span>
        <span class="legend-item"><span class="color-swatch color-Yellow"></span>injury/shutdown</span>
        <span class="legend-item"><span class="color-swatch color-Magenta"></span>workload/leave</span>
        <span class="legend-item"><span class="color-swatch color-Green"></span>upside/stash</span>
      </span>
    </span>
  </nav>

  <main id="chartView" class="view active">
    <section class="league-block">
      <h2>American League</h2>
      <div id="alChart" class="chart-grid"></div>
    </section>
    <section class="league-block">
      <h2>National League</h2>
      <div id="nlChart" class="chart-grid"></div>
    </section>
  </main>

  <main id="changelogView" class="view">
    <div class="changelog-controls">
      <select id="changelogFilter">
        <option value="ALL">All change types</option>
        <option value="chip_move">Role/team moves</option>
        <option value="chip_add">Player added</option>
        <option value="chip_remove">Player removed</option>
        <option value="color_change">Color changes</option>
        <option value="tag_change">Tag changes</option>
      </select>
      <input id="changelogSearch" type="search" placeholder="search player/team…">
      <span class="subtle" id="changelogCount"></span>
    </div>
    <div id="changelogList" class="changelog-list"></div>
  </main>

  <main id="quickhitsView" class="view">
    <div class="qh-controls">
      <select id="qhLeagueFilter">
        <option value="ALL">Both leagues</option>
        <option value="AL">AL only</option>
        <option value="NL">NL only</option>
      </select>
      <input id="qhSearch" type="search" placeholder="search text...">
    </div>
    <div id="qhList" class="qh-list"></div>
  </main>

  <div id="statTooltip" class="stat-tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js?v=25"></script>
</body>
</html>
